# deploy/compose/tools.yaml
services:
  edr-mcp:
    image: registry.palisade.example/mcp/edr@sha256:3f9c1b7e4d2a8c6f0e5b9a3d7c1f2e4b6a8d0c2e4f6a8b0c2d4e6f8a0b2c4d6e
    runtime: runsc                          # gVisor: user-space kernel between tool and host
    read_only: true                         # root filesystem is immutable
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev   # the only writable path, and nothing runs from it
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/mcp-minimal.json
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.50"
    environment:
      PALISADE_MCP_TRANSPORT: streamable-http
      EDR_API_BASE: https://edr-egress:8443   # the only place this server may talk to
    networks: [tools-internal]

  edr-egress:
    image: registry.palisade.example/infra/egress-proxy@sha256:9a1d4f7b2c8e6a0d3f5b7c9e1a2d4f6b8c0e2a4d6f8b0c2e4a6d8f0b2c4e6a8d
    environment:
      ALLOW_HOSTS: api.edr-vendor.example:443    # one upstream, by name, with TLS
    networks: [tools-internal, egress]

  gateway:
    image: registry.palisade.example/palisade/gateway@sha256:5b7e2c9f1a4d6b8e0c3f5a7d9b1e3c5f7a9d1b3e5c7f9a1d3b5e7c9f1a3d5b7e
    networks: [agents, tools-internal]         # the only workload on both segments

networks:
  agents: {}
  tools-internal:
    internal: true                            # no default route out
  egress: {}
