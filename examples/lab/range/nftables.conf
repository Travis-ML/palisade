# lab/range/nftables.conf  (apply with: nft -f lab/range/nftables.conf)
table inet range_egress {
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ip daddr 10.77.0.0/16 accept        # the range subnet only
    ct state established,related accept
    log prefix "range-egress-drop " drop
  }
}
