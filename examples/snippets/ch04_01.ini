[importlinter]
root_package = palisade

[importlinter:contract:orchestration-never-touches-infrastructure]
name = Orchestration reaches infrastructure only through the gateway and router
type = forbidden
source_modules =
    palisade.loop
    palisade.capabilities
forbidden_modules =
    palisade.tools.servers
    anthropic
    openai
    boto3
    requests
    httpx
allow_indirect_imports = True

[importlinter:contract:layer-order]
name = Lower layers never import higher ones
type = layers
layers =
    palisade.loop
    palisade.gateway
    palisade.tools
    palisade.core
